        '500':
          $ref: '#/components/responses/GalatServer'
        '501':
          $ref: '#/components/responses/BelumDiimplementasi'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT akses 15 menit, ditandatangani ed25519, audiens `lumbung`. Untuk gudang desktop berupa
        token shift 12 jam dari `POST /gudang/masuk`. Refresh 7 hari dengan reuse-detection (lihat `docs/auth.md`).
    deviceKey:
      type: apiKey
      in: header
      name: X-Device-Key
      description: |
        API key perangkat gudang terdaftar (`DEVICE_API_KEY_GUDANG`). Hak minimal: tulis `timbangan` dan
        `fee.status_cetak`; tidak boleh membaca data pengguna dan tidak menggantikan bearer. Berlaku 90 hari;
        saat rotasi kunci lama diberi tenggang 7 hari. Lihat `docs/auth.md`.
    serviceKey:
      type: apiKey
      in: header
      name: X-Service-Key
      description: |
        Kunci server-ke-server (`SERVICE_API_KEY`; web SvelteKit menyimpannya di variabel lingkungan
        server `LUMBUNG_API_KEY`, rotasi 90 hari, tidak pernah dikirim ke browser). Hak minimal (least privilege).
  parameters:
    PerangkatId:
      name: X-Perangkat-Id
      in: header
      required: false
      description: ID perangkat terdaftar (maksimal 2 perangkat per petani, 1 per sopir, PC gudang permanen).
      schema:
        type: string
    TitikId:
      name: id
      in: path
      required: true
      description: Kode titik trip.
      schema:
        type: string
        examples: [PWN-1]
    LotId:
      name: id
      in: path
      required: true
      description: Kode lot `L-NNNN` atau nomor sementara `TMP-{uuid8}`.
      schema:
        type: string
        pattern: '^(L-\d{4,}|TMP-[0-9a-f]{8})$'
        examples: [L-8812]
  responses:
    BelumDiimplementasi:
      description: Endpoint terdaftar di kontrak tetapi belum diimplementasi (501); menunggu tiket (ADR-0007).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Galat'
          example:
            error: belum diimplementasi
    InputTakTerbaca:
      description: Badan permintaan tak terbaca (JSON rusak atau `Content-Type` bukan `application/json`/`multipart/form-data`) (400). Bentuk atau nilai yang salah tetap 422.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Galat'
          example:
            error: 'validasi gagal: Expected request with `Content-Type: application/json`'
    AksiDibuat:
      description: Rekaman dibuat.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AksiHasil'
    AksiDuplikat:
      description: 'UUID klien sudah pernah diproses; hasil pertama dikembalikan tanpa rekaman ganda (duplikat: true).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AksiHasil'
          example:
            id: 0f8a6c3e-5b2d-4c1a-9e47-3a1d2b6c7f90
            duplikat: true
    Validasi:
      description: Validasi gagal (kode galat 422), contoh berat negatif atau total sortir di luar 2 persen. Galat internal AppError::Validation bernilai 400 untuk input tak terbaca.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Galat'
          example:
            error: 'validasi gagal: total sortir menyimpang lebih dari 2 persen dari berat kotor'
    TidakSah:
      description: Token kedaluwarsa atau tidak sah (401). Klien mobile me-refresh 1 kali lalu meminta login ulang.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Galat'
          example:
            error: tidak sah
    Ditolak:
      description: Peran ditolak dan dicatat (403), contoh sopir memanggil endpoint admin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Galat'
          example:
            error: akses ditolak
    TidakDitemukan:
      description: Data tidak ditemukan (404).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Galat'
          example:
            error: tidak ditemukan
    Konflik:
      description: Konflik versi (409); klien menampilkan "data gudang lebih baru".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Galat'
          example:
            error: konflik versi, data gudang lebih baru
    BatasLaju:
      description: Melebihi 60 request per menit per perangkat (429).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Galat'
          example:
            error: batas laju terlampaui
    AkunTerkunci:
      description: Akun terkunci 15 menit setelah 3 kali salah PIN (429); pesan memuat waktu berakhirnya kunci.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Galat'
          example:
            error: akun terkunci sampai 2026-10-10T07:30:00+00:00
    GalatServer:
      description: Galat basis data atau internal (500).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Galat'
          example:
            error: galat internal
  schemas:
    Galat:
      type: object
      description: Badan galat baku `AppError`. Pemetaan status - 400 validasi input, 401 tidak sah, 403 ditolak, 404 tidak ditemukan, 409 konflik versi, 422 validasi domain, 429 batas laju, 500 basis data/internal.
      required: [error]
      properties:
        error:
          type: string
          description: Pesan galat.
    Rupiah:
      type: integer
      format: int64
      minimum: 0
      description: Uang dalam rupiah integer.
    GramPositif:
      type: integer
      format: int64
      minimum: 1
      description: Berat gram integer lebih dari 0.
    Gram:
      type: integer
      format: int64
      minimum: 0
      description: Berat dalam gram integer.
    Komoditas:
      type: string
      enum: [cabai, bawang, kangkung]
      description: 3 komoditas pilot v1.0.0.
    Grade:
      type: string
      enum: [A, B, C]
    Zona:
      type: string
      enum: [DEKAT, JAUH]
      description: DEKAT (<15 km) Rp1.500/kg; JAUH (15-25 km) Rp2.500/kg.
    UuidKlien:
      type: string
      format: uuid
      description: UUID klien untuk idempotensi.
    AksiHasil:
      type: object
      required: [id, duplikat]
      properties:
        id:
          type: string
          description: ID rekaman hasil.
        duplikat:
          type: boolean
          description: true bila UUID sama sudah pernah diproses.
    Kesehatan:
      type: object
      required: [status, waktu_server]
      properties:
        status:
          type: string
          examples: [ok]
        waktu_server:
          type: string
          format: date-time
    MasukRequest:
      type: object
      additionalProperties: false
      required: [akun, pin]
      properties:
        akun:
          type: string
          minLength: 1
          description: Akun peran, contoh `sopir-02` atau `PTN-007`.
        pin:
          type: string
          pattern: '^\d{6}$'
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
    TokenResponse:
      type: object
      required: [token, refresh_token, berlaku_sampai, peran]
      properties:
        token:
          type: string
          description: JWT akses 15 menit.
        refresh_token:
          type: string
          description: Refresh 7 hari (hash disimpan di basis data).
        berlaku_sampai:
          type: string
          format: date-time
        peran:
          type: string
          enum: [petani, sopir, admin_gudang, admin_keuangan, koordinator_tani]
        trip_hari_ini:
          type: array
          description: Hanya untuk peran sopir.
          items:
            type: string
            examples: [TRIP-UT-041]
    GudangMasukRequest:
      type: object
      additionalProperties: false
      required: [operator, pin]
      properties:
        operator:
          type: string
          minLength: 1
          examples: [OPR-SORTIR-1]
        pin:
          type: string
          pattern: '^\d{6}$'
    TokenShiftResponse:
      type: object
      required: [token, berlaku_sampai]
      properties:
        token:
          type: string
          description: Token shift 12 jam; tidak boleh keluar dari PC gudang.
        berlaku_sampai:
          type: string
          format: date-time
    TitikTibaRequest:
      type: object
      additionalProperties: false
      required: [uuid, trip_id, titik_id, waktu]
      properties:
        uuid:
          $ref: '#/components/schemas/UuidKlien'
        trip_id:
          type: string
          minLength: 1
          examples: [TRIP-UT-041]
        titik_id:
          type: string
          minLength: 1
          examples: [PWN-1]
        waktu:
          type: string
          format: date-time
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
    BuktiTerimaRequest:
      type: object
      additionalProperties: false
      required: [uuid, trip_id, titik_id, waktu, foto_ids]
      properties:
        uuid:
          $ref: '#/components/schemas/UuidKlien'
        trip_id:
          type: string
          minLength: 1
        titik_id:
          type: string
          minLength: 1
        waktu:
          type: string
          format: date-time
        foto_ids:
          type: array
          description: ID foto hasil `POST /unggah-foto`, maksimal 4.
          maxItems: 4
          items:
            type: string
            format: uuid
        tanda_tangan:
          type: string
          description: ID berkas tanda tangan penerima (opsional).
        catatan:
          type: string
    InsidenRequest:
      type: object
      additionalProperties: false
      required: [uuid, jenis]
      properties:
        uuid:
          $ref: '#/components/schemas/UuidKlien'
        jenis:
          type: string
          minLength: 1
          maxLength: 64
          description: Jenis insiden, contoh keterlambatan.
        catatan:
          type: string
        foto_ids:
          type: array
          maxItems: 4
          items:
            type: string
            format: uuid
    Insiden:
      type: object
      required: [id, jenis, waktu]
      properties:
        id:
          type: string
          pattern: '^INS-\d{8}-\d{3}$'
          examples: [INS-20261010-001]
        jenis:
          type: string
        catatan:
          type: string
        waktu:
          type: string
          format: date-time
    Titik:
      type: object
      required: [id, urutan]
      properties:
        id:
          type: string
          examples: [PWN-1]
        urutan:
          type: integer
          minimum: 1
        zona:
          $ref: '#/components/schemas/Zona'
        tiba_pada:
          type: [string, 'null']
          format: date-time
        berangkat_pada:
          type: [string, 'null']
          format: date-time
    Trip:
      type: object
      required: [kode, rute, status]
      properties:
        kode:
          type: string
          pattern: '^TRIP-[A-Z]{2}-\d{3}$'
          examples: [TRIP-UT-041]
        rute:
          type: string
          enum: [UTARA, SELATAN, KOTA]
        kendaraan:
          type: string
        kas_jalan:
          $ref: '#/components/schemas/Rupiah'
          description: Kas jalan Rp300.000 per trip.
        status:
          type: string
          enum: [DISUSUN, BERJALAN, SELESAI]
          description: DISUSUN saat dibuat, BERJALAN pada tiba pertama, SELESAI saat semua titik sudah berangkat.
        tanggal:
          type: string
          format: date
          description: Tanggal tugas (WIB). Tambahan opsional v1.0.0 (lihat ADR-0004).
        sopir:
          type: string
          description: Akun sopir yang bertugas bila ditugaskan. Tambahan opsional v1.0.0 (lihat ADR-0004).
        titik:
          type: array
          items:
            $ref: '#/components/schemas/Titik'
    TitikBaru:
      type: object
      required: [id, zona]
      additionalProperties: false
      description: Titik tujuan trip (tambahan opsional v1.0.0, lihat ADR-0004); zona menentukan tarif fee.
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 32
          examples: [PWN-1]
        zona:
          $ref: '#/components/schemas/Zona'
        pesanan:
          type: string
          pattern: '^PSO-\d{8}-\d{3}$'
          description: Pesanan yang dilayani titik ini (dasar fee per pesanan); tidak boleh dobel pada satu trip.
        pembeli:
          type: string
          minLength: 1
          maxLength: 64
          description: Pembeli yang ditagih fee (invoice mingguan per pembeli). Fee tanpa pembeli tidak masuk invoice. Tambahan opsional v1.0.0 (ADR-0005).
        keranjang:
          type: array
          description: Subset keranjang trip yang diantar ke titik ini.
          items:
            type: string
            pattern: '^KRJ-(00[1-9]|0[1-9][0-9]|1[01][0-9]|120)$'
    BuatTripRequest:
      type: object
      required: [uuid, rute, kendaraan, keranjang]
      additionalProperties: false
      properties:
        uuid:
          $ref: '#/components/schemas/UuidKlien'
        rute:
          type: string
          enum: [UTARA, SELATAN, KOTA]
        kendaraan:
          type: string
          minLength: 1
          maxLength: 64
        kas_jalan:
          type: integer
          enum: [300000]
          description: Bila dikirim harus 300000 (nilai tetap FSD/20); bila kosong server memakai 300000.
        keranjang:
          type: array
          description: Kode keranjang yang dimuat (minimal 1, tanpa dobel; harus berisi aktif dan belum di trip lain).
          minItems: 1
          items:
            type: string
            pattern: '^KRJ-(00[1-9]|0[1-9][0-9]|1[01][0-9]|120)$'
        tanggal:
          type: string
          format: date
          description: Tanggal tugas; bawaan hari ini (WIB). Tambahan opsional v1.0.0 (ADR-0004).
        sopir:
          type: string
          minLength: 1
          description: Akun sopir yang bertugas; wajib akun sopir aktif. Tambahan opsional v1.0.0 (ADR-0004).
        titik:
          type: array
          maxItems: 20
          description: Titik tujuan berurutan. Tambahan opsional v1.0.0 (ADR-0004).
          items:
            $ref: '#/components/schemas/TitikBaru'
    SuratJalan:
      type: object
      required: [nomor, trip, keranjang]
      properties:
        nomor:
          type: string
          pattern: '^SJ-\d{8}-\d{3}$'
          examples: [SJ-20261010-001]
        trip:
          type: string
        keranjang:
          type: array
          items:
            type: object
            required: [kode, grade, berat_g]
            properties:
              kode:
                type: string
              grade:
                $ref: '#/components/schemas/Grade'
              berat_g:
                $ref: '#/components/schemas/Gram'
        fee_total:
          $ref: '#/components/schemas/Rupiah'
        rincian_fee:
          type: array
          items:
            $ref: '#/components/schemas/Fee'
        nomor_sementara:
          type: [string, 'null']
          description: Nomor `TMP-*` yang dipetakan (bila ada); cetak ulang tersedia bila nomor berubah.
    BuatLotRequest:
      type: object
      additionalProperties: false
      required: [uuid, kode_petani, komoditas, tanggal, berat_kotor_g]
      properties:
        uuid:
          $ref: '#/components/schemas/UuidKlien'
        kode_petani:
          type: string
          pattern: '^PTN-\d{3}$'
        komoditas:
          $ref: '#/components/schemas/Komoditas'
        tanggal:
          type: string
          format: date
        berat_kotor_g:
          $ref: '#/components/schemas/GramPositif'
        petugas:
          type: string
    Lot:
      type: object
      required: [kode, komoditas, status, berat_kotor_g, versi]
      properties:
        kode:
          type: string
          description: Kode resmi `L-NNNN` atau sementara `TMP-{uuid8}`.
          examples: [L-8812]
        kode_petani:
          type: string
        komoditas:
          $ref: '#/components/schemas/Komoditas'
        status:
          type: string
          enum: [BARU, DISORTIR, DIMUAT, DITERIMA]
        berat_kotor_g:
          $ref: '#/components/schemas/Gram'
        grade_a_g:
          $ref: '#/components/schemas/Gram'
        grade_b_g:
          $ref: '#/components/schemas/Gram'
        grade_c_g:
          $ref: '#/components/schemas/Gram'
        versi:
          type: integer
          minimum: 1
          description: Versi rekaman untuk resolusi konflik (mulai 1).
        dibuat_pada:
          type: string
          format: date-time
        dibuat_oleh:
          type: string
        duplikat:
          type: boolean
    SortirRequest:
      type: object
      additionalProperties: false
      required: [uuid, lot_id, grade_a_g, grade_b_g, grade_c_g]
      description: Total A+B+C wajib sama dengan berat kotor dalam toleransi 2 persen, jika tidak 422.
      properties:
        uuid:
          $ref: '#/components/schemas/UuidKlien'
        lot_id:
          type: string
        grade_a_g:
          $ref: '#/components/schemas/Gram'
        grade_b_g:
          $ref: '#/components/schemas/Gram'
        grade_c_g:
          $ref: '#/components/schemas/Gram'
        petugas:
          type: string
    KeranjangItem:
      type: object
      additionalProperties: false
      required: [kode, lot_id, grade, berat_g]
      properties:
        kode:
          type: string
          pattern: '^KRJ-(00[1-9]|0[1-9][0-9]|1[01][0-9]|120)$'
        lot_id:
          type: string
          minLength: 1
        grade:
          $ref: '#/components/schemas/Grade'
        berat_g:
          $ref: '#/components/schemas/GramPositif'
    KeranjangBatchRequest:
      type: object
      additionalProperties: false
      required: [uuid, keranjang]
      properties:
        uuid:
          $ref: '#/components/schemas/UuidKlien'
        keranjang:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/KeranjangItem'
    StokLot:
      type: object
      required: [lot_id, komoditas, grade, sisa_g]
      properties:
        lot_id:
          type: string
        komoditas:
          $ref: '#/components/schemas/Komoditas'
        grade:
          $ref: '#/components/schemas/Grade'
        sisa_g:
          $ref: '#/components/schemas/Gram'
    SinkronRekaman:
      type: object
      required: [uuid, jenis, payload]
      additionalProperties: false
      properties:
        uuid:
          $ref: '#/components/schemas/UuidKlien'
        jenis:
          type: string
          enum: [lot, sortir, keranjang, trip, surat_jalan, bukti_terima, insiden]
        nomor_sementara:
          type: string
          pattern: '^TMP-[0-9a-f]{8}$'
        payload:
          type: object
          description: |
            Badan request endpoint asal sesuai jenis (tanpa `uuid`; diisi dari `uuid` rekaman, dan bila ada
            harus sama). Jenis `surat_jalan` memuat `trip_id` (kode trip atau UUID klien trip).
          additionalProperties: true
        dibuat_pada:
          type: string
          format: date-time
          description: Waktu dibuat di perangkat. `surat_jalan` lebih tua dari 72 jam ditolak (kunci offline 3x24 jam).
    SinkronBatchRequest:
      type: object
      required: [rekaman]
      properties:
        rekaman:
          type: array
          description: Maksimal 200 rekaman, urut FIFO.
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/SinkronRekaman'
    SinkronBatchResponse:
      type: object
      required: [hasil]
      properties:
        hasil:
          type: array
          items:
            type: object
            required: [uuid, status]
            properties:
              uuid:
                $ref: '#/components/schemas/UuidKlien'
              status:
                type: string
                enum: [DITERIMA, DUPLIKAT, KONFLIK, DITOLAK]
              nomor_resmi:
                type: [string, 'null']
                description: Nomor resmi (`L-NNNN`, `SJ-YYYYMMDD-NNN`) yang memetakan nomor `TMP-*`.
              pesan:
                type: [string, 'null']
    KontrakSaya:
      type: object
      required: [petani, musim_mulai, musim_selesai, komitmen]
      properties:
        petani:
          type: string
          pattern: '^PTN-\d{3}$'
        musim_mulai:
          type: string
          format: date
        musim_selesai:
          type: string
          format: date
          description: Kontrak mini musim 90 hari.
        komitmen:
          type: array
          items:
            type: object
            required: [komoditas, komitmen_g, realisasi_g]
            properties:
              komoditas:
                $ref: '#/components/schemas/Komoditas'
              komitmen_g:
                $ref: '#/components/schemas/Gram'
              realisasi_g:
                $ref: '#/components/schemas/Gram'
    RencanaSetoranRequest:
      type: object
      additionalProperties: false
      required: [uuid, komoditas, estimasi_g, tanggal]
      properties:
        uuid:
          $ref: '#/components/schemas/UuidKlien'
        komoditas:
          $ref: '#/components/schemas/Komoditas'
        estimasi_g:
          $ref: '#/components/schemas/Gram'
        tanggal:
          type: string
          format: date
    Pembayaran:
      type: object
      required: [lot_id, nominal, status, jatuh_tempo]
      properties:
        lot_id:
          type: string
        nominal:
          $ref: '#/components/schemas/Rupiah'
        status:
          type: string
          enum: [MENUNGGU, DIBAYAR, TERLAMBAT]
        jatuh_tempo:
          type: string
          format: date
          description: H+1 setelah lot diterima.
        denda:
          $ref: '#/components/schemas/Rupiah'
          description: Denda Lumbung 0,5 persen per hari, maksimal 5 persen.
    HargaGrade:
      type: object
      required: [a, b]
      properties:
        a:
          $ref: '#/components/schemas/Rupiah'
        b:
          $ref: '#/components/schemas/Rupiah'
    PapanHarga:
      type: object
      required: [cabai, bawang, kangkung, fee, berlaku]
      properties:
        cabai:
          $ref: '#/components/schemas/HargaGrade'
        bawang:
          $ref: '#/components/schemas/HargaGrade'
        kangkung:
          $ref: '#/components/schemas/HargaGrade'
        fee:
          type: object
          required: [dekat, jauh]
          properties:
            dekat:
              type: integer
              const: 1500
            jauh:
              type: integer
              const: 2500
        berlaku:
          type: string
          examples: ['2026-10-06 s.d. 2026-10-12']
    TerbitPapanRequest:
      type: object
      additionalProperties: false
      required: [uuid, berlaku_mulai, referensi]
      additionalProperties: false
      properties:
        uuid:
          $ref: '#/components/schemas/UuidKlien'
        berlaku_mulai:
          type: string
          format: date
          description: Hari Senin minggu berlaku (selain Senin `422`); papan berlaku Senin sampai Minggu.
        referensi:
          type: array
          description: Tiga harga pasar referensi per komoditas (Pasar Induk, pasar kota, eceran daring); ketiga komoditas pilot wajib ada tepat sekali, harga lebih dari 0.
          items:
            type: object
            required: [komoditas, harga]
            properties:
              komoditas:
                $ref: '#/components/schemas/Komoditas'
              harga:
                type: array
                minItems: 3
                maxItems: 3
                items:
                  $ref: '#/components/schemas/Rupiah'
    Profil:
      type: object
      required: [nama]
      properties:
        nama:
          type: string
        deskripsi:
          type: string
        kontak_kemitraan:
          type: string
    RekapHarian:
      type: object
      required: [tanggal, masuk, fee_tertagih, susut_persen]
      properties:
        tanggal:
          type: string
          format: date
        masuk:
          type: array
          items:
            type: object
            required: [komoditas, berat_g]
            properties:
              komoditas:
                $ref: '#/components/schemas/Komoditas'
              berat_g:
                $ref: '#/components/schemas/Gram'
        fee_tertagih:
          $ref: '#/components/schemas/Rupiah'
        susut_persen:
          type: number
          description: Target susut total di bawah 5 persen.
    Invoice:
      type: object
      required: [id, pembeli, minggu, nominal, status, jatuh_tempo]
      properties:
        id:
          type: string
        pembeli:
          type: string
        minggu:
          type: string
          examples: ['2026-W41']
        nominal:
          $ref: '#/components/schemas/Rupiah'
          description: Total fee minggu itu, tanpa denda.
        status:
          type: string
          enum: [TERBIT, LUNAS, LEWAT_JATUH_TEMPO]
        jatuh_tempo:
          type: string
          format: date
        denda:
          $ref: '#/components/schemas/Rupiah'
          description: 1 persen per minggu, maksimal 4 persen.
    Mitra:
      type: object
      required: [kode, nama, status]
      properties:
        kode:
          type: string
          pattern: '^PTN-\d{3}$'
        nama:
          type: string
        status:
          type: string
          enum: [AKTIF, NONAKTIF]
    AuditHasil:
      type: object
      required: [audit_id]
      properties:
        audit_id:
          type: string
          pattern: '^AUD-\d{8}-\d{3}$'
          examples: [AUD-20261009-003]
          description: ID audit (nama + waktu) yang tampil di dasbor.
        duplikat:
          type: boolean
          description: true bila UUID klien sama sudah pernah diproses (hanya pada penulisan idempoten).
    Fee:
      type: object
      description: Rujukan skema fee per pesanan (`PSO-YYYYMMDD-NNN`); nominal = berat kg x tarif zona.
      required: [pesanan, berat_g, zona, tarif_per_kg, nominal]
      properties:
        pesanan:
          type: string
          pattern: '^PSO-\d{8}-\d{3}$'
        berat_g:
          $ref: '#/components/schemas/Gram'
        zona:
