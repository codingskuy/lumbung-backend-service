        Tanpa login; boleh di-cache CDN 15 menit (`Cache-Control: public, max-age=900`). Berlaku Senin-Minggu;
        dihitung Jumat 15.00, publikasi maksimal 17.00. `404` bila papan minggu berjalan belum diterbitkan
        (klien menampilkan "belum terbit"; tidak ada papan minggu lain yang dipakai sebagai pengganti).
      security: []
      responses:
        '200':
          description: Papan harga.
          headers:
            Cache-Control:
              description: Cache 15 menit.
              schema:
                type: string
                examples: ['public, max-age=900']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PapanHarga'
              example:
                cabai: {a: 31500, b: 26500}
                bawang: {a: 28000, b: 23500}
                kangkung: {a: 6000, b: 5000}
                fee: {dekat: 1500, jauh: 2500}
                berlaku: '2026-10-06 s.d. 2026-10-12'
        '404':
          $ref: '#/components/responses/TidakDitemukan'
        '429':
          $ref: '#/components/responses/BatasLaju'
