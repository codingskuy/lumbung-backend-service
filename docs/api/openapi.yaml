            application/json:
              schema:
                $ref: '#/components/schemas/Lot'
        '401':
          $ref: '#/components/responses/TidakSah'
        '403':
          $ref: '#/components/responses/Ditolak'
        '404':
          $ref: '#/components/responses/TidakDitemukan'
        '409':
          $ref: '#/components/responses/Konflik'
        '422':
          $ref: '#/components/responses/Validasi'
        '429':
          $ref: '#/components/responses/BatasLaju'
        '500':
          $ref: '#/components/responses/GalatServer'

