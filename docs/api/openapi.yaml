        otomatis dan cetak ulang tersedia bila nomor berubah. Satu surat jalan per trip: `uuid` berbeda untuk
        trip yang sama `409`. Fee dihitung server per pesanan (titik dengan `pesanan` dan keranjang yang
        ditetapkan): berat gram x tarif zona per kg (DEKAT Rp1.500, JAUH Rp2.500), rupiah integer dibulatkan
        setengah naik; contoh 170.000 g zona DEKAT = Rp255.000. `fee_total` dan `rincian_fee` ada pada respons 201.
      security:
