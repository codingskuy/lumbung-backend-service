      description: |
        Contoh 25 keranjang x 20 kg = 500 kg. Keranjang berkode permanen `KRJ-001` sampai `KRJ-120`
        (keranjang fisik dipakai berulang; satu kode hanya satu isi aktif, bila masih terisi `409`).
        Atomik: satu item gagal, seluruh batch tidak tersimpan. `422` bila lebih dari 50 atau kosong,
        kode di luar rentang atau dobel, berat kurang dari atau sama dengan 0, lot belum disortir,
        stok lot/grade tidak cukup, atau Grade C (ditolak dari rantai dingin, percobaannya dicatat).
        `uuid` berlaku untuk seluruh batch. Lot tak ditemukan `404`.
      security:
        - bearerAuth: []
          deviceKey: []
      parameters:
        - $ref: '#/components/parameters/PerangkatId'
      requestBody:
        required: true
        content:
