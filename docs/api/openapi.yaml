openapi: 3.1.0
info:
  title: API Lumbung — ChefGenie
  version: 1.0.0
  summary: Kontrak API Lumbung-Backend v1.0.0 (agregasi, distribusi, fee per kg).
  description: |
    Kontrak API layanan `lumbung-backend-service` untuk divisi Lumbung (agregasi panen petani,
    sortir Grade A/B/C, trip antar, fee logistik per kg, papan harga mingguan).

    Sumber kebenaran: `platform/versions/v1.0.0/FSD/30-kontrak.md` dan
    `produk/30..32-kontrak-api-*.md` di Lumbung-TownHall; autentikasi mengikuti `docs/auth.md`
    repo ini.

    **Aturan angka**
    - Berat selalu **gram integer** (web menerima kg desimal dari pengguna lalu server SvelteKit
      mengonversi ke gram sebelum memanggil API ini).
    - Uang selalu **rupiah integer**.
    - Komoditas pilot v1.0.0: `cabai`, `bawang`, `kangkung`.
    - Fee: Zona `DEKAT` (<15 km) Rp1.500/kg, Zona `JAUH` (15-25 km) Rp2.500/kg.

    **Idempotensi.** Semua `POST` membawa `uuid` klien. Pengiriman ulang dengan `uuid` sama
    mengembalikan `200` dengan `duplikat: true` tanpa rekaman ganda.

    **Batas laju.** Maksimal 60 request per menit per perangkat (`429`).

    **Klien tidak menghitung fee, grade, atau papan harga**; semua angka resmi dari server.
  contact:
    name: Tech Lead Lumbung
    url: https://github.com/Coding-Skuy/Lumbung-TownHall
  license:
    name: GNU AGPL v3.0 (lihat LICENSE repo)
    identifier: AGPL-3.0-only
servers:
  - url: https://api.lumbung.chefgenie.id/v1
    description: Produksi
  - url: http://localhost:8080/v1
    description: Lokal (cargo run); semua rute API ada di bawah awalan /v1 (selain /healthz untuk infra).
tags:
  - name: Sistem
    description: Kesehatan layanan.
  - name: Auth
    description: JWT akses 15 menit, refresh 7 hari (reuse-detection), login shift gudang.
  - name: Sopir
    description: Endpoint mobile sopir (5 endpoint, termasuk unggah foto).
  - name: Petani
    description: Endpoint mobile petani (4 endpoint, difilter server per id petani).
  - name: Gudang
    description: Endpoint desktop Windows gudang (7 endpoint).
  - name: Publik
    description: Web publik tanpa login, cache 15 menit (2 endpoint).
  - name: Admin
    description: Web admin dengan sesi peran (4 baca + 3 tulis beraudit).
security:
  - bearerAuth: []
paths:
  /kesehatan:
    get:
      tags: [Sistem]
      operationId: kesehatan
      summary: Cek kesehatan layanan
      description: Mengembalikan status ok dan waktu server.
      security: []
      responses:
        '200':
          description: Layanan sehat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Kesehatan'
              example:
                status: ok
                waktu_server: '2026-10-04T10:00:00+07:00'
        '429':
          $ref: '#/components/responses/BatasLaju'
        '500':
          $ref: '#/components/responses/GalatServer'

  /auth/masuk:
    post:
      tags: [Auth]
      operationId: authMasuk
      summary: Masuk pengguna (akun peran + PIN)
      description: |
        Akun peran (contoh `sopir-02`, `PTN-007`) + PIN 6 digit. Tiga kali salah PIN mengunci akun
        15 menit. Mengembalikan JWT akses 15 menit (ed25519, audiens `lumbung`) dan refresh 7 hari.
        Tidak ada login hanya dengan nama; 1 orang 1 akun. PIN salah dan akun tidak ada sama-sama
        `401` (tanpa membocorkan keberadaan akun). Akun yang sedang terkunci mendapat `429` dengan
        pesan `akun terkunci sampai <waktu>` walau PIN benar. Format PIN salah `422`, JSON rusak `400`.
      security: []
      parameters:
        - $ref: '#/components/parameters/PerangkatId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MasukRequest'
            example:
              akun: sopir-02
              pin: '123456'
      responses:
        '400':
          $ref: '#/components/responses/InputTakTerbaca'
        '200':
          description: Token diterbitkan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/TidakSah'
        '422':
          $ref: '#/components/responses/Validasi'
        '429':
          $ref: '#/components/responses/AkunTerkunci'
        '500':
          $ref: '#/components/responses/GalatServer'

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: authRefresh
      summary: Perbarui token akses
      description: |
        Menukar refresh token (7 hari) dengan JWT akses baru dan refresh baru (rotasi). Bila refresh
        token lama dipakai dua kali (reuse-detection), seluruh keluarga refresh pengguna dicabut dan
        pengguna wajib masuk ulang (`401`). Klien mobile me-refresh otomatis 1 kali lalu meminta login ulang.
        Refresh token berformat opak `<id>.<rahasia>`; klien menyimpannya apa adanya.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '400':
          $ref: '#/components/responses/InputTakTerbaca'
        '422':
          $ref: '#/components/responses/Validasi'
        '200':
          description: Token baru.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/TidakSah'
        '500':
          $ref: '#/components/responses/GalatServer'

  /auth/keluar:
    post:
      tags: [Auth]
      operationId: authKeluar
      summary: Keluar (cabut keluarga refresh)
      description: Menghapus keluarga refresh sesi ini dari basis data (sesi perangkat lain tidak terpengaruh); token akses kedaluwarsa sendiri dalam 15 menit.
      responses:
        '204':
          description: Berhasil keluar.
        '401':
          $ref: '#/components/responses/TidakSah'
        '500':
          $ref: '#/components/responses/GalatServer'

  /gudang/masuk:
    post:
      tags: [Auth, Gudang]
      operationId: gudangMasuk
      summary: Login shift gudang
      description: |
        Kredensial perangkat gudang terdaftar (`X-Device-Key`) + PIN operator per shift (contoh
        `OPR-SORTIR-1`). Mengembalikan token shift berumur 12 jam. Token shift tidak boleh keluar dari
        PC gudang. Tiga salah PIN mengunci 15 menit (`429`) dan tercatat di audit (`akun_terkunci`) untuk
        Kepala Agregasi. Kunci perangkat salah atau kedaluwarsa `401`; akun yang bukan operator gudang `403`.
      security:
        - deviceKey: []
      parameters:
        - $ref: '#/components/parameters/PerangkatId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GudangMasukRequest'
            example:
              operator: OPR-SORTIR-1
              pin: '123456'
      responses:
        '400':
          $ref: '#/components/responses/InputTakTerbaca'
        '200':
          description: Token shift diterbitkan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenShiftResponse'
        '401':
          $ref: '#/components/responses/TidakSah'
        '403':
          $ref: '#/components/responses/Ditolak'
        '422':
          $ref: '#/components/responses/Validasi'
        '429':
          $ref: '#/components/responses/AkunTerkunci'
        '500':
          $ref: '#/components/responses/GalatServer'

  /gudang/keluar:
    post:
      tags: [Gudang]
      operationId: gudangKeluar
      summary: Tutup shift gudang
      description: Wajib dipanggil tiap tutup shift 14.00; mencabut token shift. Hanya token shift yang diterima (token akses biasa `401`).
      security:
        - bearerAuth: []
          deviceKey: []
      parameters:
        - $ref: '#/components/parameters/PerangkatId'
      responses:
        '204':
          description: Shift ditutup.
        '401':
          $ref: '#/components/responses/TidakSah'
        '403':
          $ref: '#/components/responses/Ditolak'
        '500':
          $ref: '#/components/responses/GalatServer'

  /trip-hari-ini:
    get:
      tags: [Sopir]
      operationId: tripHariIni
      summary: Daftar trip hari ini beserta titik berurutan
      description: Sopir hanya melihat tripnya hari itu. SLA p95 <800 ms pada koneksi 3G.
      parameters:
        - $ref: '#/components/parameters/PerangkatId'
      responses:
        '200':
          description: Daftar trip.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Trip'
        '401':
          $ref: '#/components/responses/TidakSah'
        '403':
          $ref: '#/components/responses/Ditolak'
        '500':
          $ref: '#/components/responses/GalatServer'

  /titik/{id}/tiba:
    post:
      tags: [Sopir]
      operationId: titikTiba
      summary: Catat tiba di titik
      description: |
        Hanya sopir yang ditugaskan pada trip (selain itu `403`, dicatat). `{id}` harus sama dengan `titik_id`
        pada badan. Tiba pertama mengubah trip menjadi `BERJALAN`. Kejadian ulang dengan `uuid` lain menimpa
        waktu (lapangan menang untuk posisi).
      parameters:
        - $ref: '#/components/parameters/TitikId'
        - $ref: '#/components/parameters/PerangkatId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TitikTibaRequest'
            example:
              uuid: 0f8a6c3e-5b2d-4c1a-9e47-3a1d2b6c7f90
              trip_id: TRIP-UT-041
              titik_id: PWN-1
              waktu: '2026-10-10T07:15:00+07:00'
              lat: -7.79
              lng: 110.36
      responses:
        '400':
          $ref: '#/components/responses/InputTakTerbaca'
        '200':
          $ref: '#/components/responses/AksiDuplikat'
        '201':
          $ref: '#/components/responses/AksiDibuat'
        '401':
          $ref: '#/components/responses/TidakSah'
        '403':
          $ref: '#/components/responses/Ditolak'
        '404':
          $ref: '#/components/responses/TidakDitemukan'
        '409':
          $ref: '#/components/responses/Konflik'
        '422':
          $ref: '#/components/responses/Validasi'
        '429':
          $ref: '#/components/responses/BatasLaju'
        '500':
          $ref: '#/components/responses/GalatServer'

  /titik/{id}/berangkat:
    post:
      tags: [Sopir]
      operationId: titikBerangkat
      summary: Catat berangkat dari titik
      description: |
        Wajib sudah tiba di titik itu dan waktu tidak lebih awal dari waktu tiba (selain itu `422`). Setelah semua
        titik berangkat trip menjadi `SELESAI` dan keranjang dikosongkan.
      parameters:
        - $ref: '#/components/parameters/TitikId'
        - $ref: '#/components/parameters/PerangkatId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TitikTibaRequest'
      responses:
        '400':
          $ref: '#/components/responses/InputTakTerbaca'
        '200':
          $ref: '#/components/responses/AksiDuplikat'
        '201':
          $ref: '#/components/responses/AksiDibuat'
        '401':
          $ref: '#/components/responses/TidakSah'
        '403':
          $ref: '#/components/responses/Ditolak'
        '404':
          $ref: '#/components/responses/TidakDitemukan'
        '409':
          $ref: '#/components/responses/Konflik'
        '422':
          $ref: '#/components/responses/Validasi'
        '429':
          $ref: '#/components/responses/BatasLaju'
        '500':
          $ref: '#/components/responses/GalatServer'

  /bukti-terima:
    post:
      tags: [Sopir]
      operationId: buktiTerima
      summary: Kirim bukti terima (metadata JSON)
      description: |
        Metadata + UUID; foto diunggah terpisah lewat `POST /unggah-foto` (maksimal 4 foto per bukti,
        masing-masing JPEG maksimal 500 KB; minimal satu foto atau `tanda_tangan`). Resolusi konflik: lapangan
        menang untuk bukti terima dan posisi: bukti baru untuk titik yang sama dengan `uuid` lain diterima dan
        berlaku, bukti lama disimpan sebagai riwayat dan penggantian dicatat sebagai insiden `konflik_sinkron`.
        Keranjang titik itu dikosongkan; lot menjadi `DITERIMA` bila seluruh keranjangnya selesai.
      parameters:
        - $ref: '#/components/parameters/PerangkatId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuktiTerimaRequest'
      responses:
        '400':
          $ref: '#/components/responses/InputTakTerbaca'
        '200':
          $ref: '#/components/responses/AksiDuplikat'
        '201':
          $ref: '#/components/responses/AksiDibuat'
        '401':
          $ref: '#/components/responses/TidakSah'
        '403':
          $ref: '#/components/responses/Ditolak'
        '404':
          $ref: '#/components/responses/TidakDitemukan'
        '409':
          $ref: '#/components/responses/Konflik'
        '422':
          $ref: '#/components/responses/Validasi'
        '429':
          $ref: '#/components/responses/BatasLaju'
        '500':
          $ref: '#/components/responses/GalatServer'

  /unggah-foto:
    post:
      tags: [Sopir]
      operationId: unggahFoto
      summary: Unggah foto bukti (JPEG maks 500 KB)
      description: |
        Dipisah dari JSON agar hemat kuota. Foto disimpan 1 tahun lalu hanya metadata. `uuid` menjadi `foto_id`
        (idempoten: kirim ulang `200`). Berkas harus JPEG utuh (diawali FFD8FF dan diakhiri FFD9) berukuran 1 sampai
        512.000 byte (500 KB); pelanggaran `422`. Badan permintaan di atas 1 MiB ditolak `413` sebelum dibaca.
      parameters:
        - $ref: '#/components/parameters/PerangkatId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [uuid, berkas]
              properties:
                uuid:
                  type: string
                  format: uuid
                  description: UUID klien (idempotensi).
                berkas:
                  type: string
                  contentMediaType: image/jpeg
                  minLength: 1
                  description: Berkas JPEG utuh, 1 sampai 512000 byte (500 KB).
      responses:
        '400':
          $ref: '#/components/responses/InputTakTerbaca'
        '200':
          $ref: '#/components/responses/AksiDuplikat'
        '201':
          description: Foto tersimpan.
          content:
            application/json:
              schema:
                type: object
                required: [foto_id, duplikat]
                properties:
                  foto_id:
                    type: string
                    format: uuid
                  duplikat:
                    type: boolean
                    const: false
        '401':
          $ref: '#/components/responses/TidakSah'
        '403':
          $ref: '#/components/responses/Ditolak'
        '422':
          $ref: '#/components/responses/Validasi'
        '429':
          $ref: '#/components/responses/BatasLaju'
        '500':
          $ref: '#/components/responses/GalatServer'

  /insiden:
    post:
      tags: [Sopir]
      operationId: buatInsiden
      summary: Laporkan insiden (keterlambatan, konflik, dll.)
      description: ID insiden berformat `INS-YYYYMMDD-NNN` (urutan per hari WIB). Foto opsional (maksimal 4, harus sudah diunggah).
      parameters:
        - $ref: '#/components/parameters/PerangkatId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsidenRequest'
      responses:
        '400':
          $ref: '#/components/responses/InputTakTerbaca'
        '200':
          $ref: '#/components/responses/AksiDuplikat'
        '201':
          $ref: '#/components/responses/AksiDibuat'
        '401':
          $ref: '#/components/responses/TidakSah'
        '403':
          $ref: '#/components/responses/Ditolak'
        '422':
          $ref: '#/components/responses/Validasi'
        '429':
          $ref: '#/components/responses/BatasLaju'
        '500':
          $ref: '#/components/responses/GalatServer'

  /kontrak-saya:
    get:
      tags: [Petani]
      operationId: kontrakSaya
      summary: Kontrak musim 90 hari milik petani
      description: Komitmen vs realisasi kg musim berjalan. Difilter server per id petani.
      parameters:
        - $ref: '#/components/parameters/PerangkatId'
      responses:
        '200':
          description: Kontrak petani.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KontrakSaya'
        '401':
          $ref: '#/components/responses/TidakSah'
        '403':
          $ref: '#/components/responses/Ditolak'
        '404':
          $ref: '#/components/responses/TidakDitemukan'
        '500':
          $ref: '#/components/responses/GalatServer'
        '501':
          $ref: '#/components/responses/BelumDiimplementasi'

  /rencana-setoran:
    post:
      tags: [Petani]
      operationId: rencanaSetoran
      summary: Ajukan rencana setoran
      parameters:
        - $ref: '#/components/parameters/PerangkatId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RencanaSetoranRequest'
      responses:
        '400':
          $ref: '#/components/responses/InputTakTerbaca'
        '200':
          $ref: '#/components/responses/AksiDuplikat'
        '201':
          $ref: '#/components/responses/AksiDibuat'
        '401':
          $ref: '#/components/responses/TidakSah'
        '403':
          $ref: '#/components/responses/Ditolak'
        '422':
          $ref: '#/components/responses/Validasi'
        '429':
          $ref: '#/components/responses/BatasLaju'
        '500':
          $ref: '#/components/responses/GalatServer'
        '501':
          $ref: '#/components/responses/BelumDiimplementasi'

  /pembayaran-saya:
    get:
      tags: [Petani]
      operationId: pembayaranSaya
      summary: Riwayat pembayaran H+1 petani
      description: |
        Pembayaran dihitung dari berat bersih per grade x harga papan minggu berjalan (Grade A 100 persen harga papan,
        Grade B 85 persen harga papan Grade A, dibulatkan setengah naik per grade; Grade C ditolak/tidak dibayar); target ketepatan minimal
        95% lot per minggu. Dibuat saat sortir dicatat, jatuh tempo H+1 (tanggal WIB). Denda Lumbung 0,5 persen
        per hari keterlambatan, maksimal 5 persen, otomatis; status `TERLAMBAT` setelah jatuh tempo. Hanya peran
        `petani`; difilter server per id petani (akun peran = kode petani), parameter apa pun diabaikan. Lot yang
        papan minggunya belum terbit belum tampil karena nominalnya belum bisa dihitung.
      parameters:
        - $ref: '#/components/parameters/PerangkatId'
      responses:
        '200':
          description: Riwayat pembayaran.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pembayaran'
        '401':
          $ref: '#/components/responses/TidakSah'
        '403':
          $ref: '#/components/responses/Ditolak'
        '500':
          $ref: '#/components/responses/GalatServer'

  /papan-harga:
    get:
      tags: [Petani]
      operationId: papanHargaPetani
      summary: Papan harga minggu berjalan (baca saja)
      description: |
        Petani tidak dapat mengubah harga. Perlu login (bearer); cache hanya privat
        (`Cache-Control: private, max-age=900`). `404` bila papan minggu berjalan belum terbit.
      parameters:
        - $ref: '#/components/parameters/PerangkatId'
      responses:
        '200':
          description: Papan harga.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PapanHarga'
        '401':
          $ref: '#/components/responses/TidakSah'
        '403':
          $ref: '#/components/responses/Ditolak'
        '404':
          $ref: '#/components/responses/TidakDitemukan'
        '500':
          $ref: '#/components/responses/GalatServer'

  /lot:
    post:
      tags: [Gudang]
      operationId: buatLot
      summary: Buat lot + timbang kotor
      description: |
        Server menerbitkan kode lot resmi `L-NNNN`; saat offline klien memakai nomor sementara
        `TMP-{uuid8}` yang dipetakan ke nomor resmi saat sinkron. Petani harus terdaftar dan `AKTIF`
        (selain itu `422`). Mencatat timbang `KOTOR`. Hanya peran `admin_gudang` (bearer shift/akses + `X-Device-Key`).
      security:
        - bearerAuth: []
          deviceKey: []
      parameters:
        - $ref: '#/components/parameters/PerangkatId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuatLotRequest'
            example:
              uuid: 6b0d8a4e-1c2f-4d5a-8e91-2f3a4b5c6d7e
              kode_petani: PTN-007
              komoditas: cabai
              tanggal: '2026-10-06'
              berat_kotor_g: 120000
              petugas: OPR-SORTIR-1
      responses:
        '400':
          $ref: '#/components/responses/InputTakTerbaca'
        '200':
          $ref: '#/components/responses/AksiDuplikat'
        '201':
          description: Lot dibuat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lot'
        '401':
          $ref: '#/components/responses/TidakSah'
        '403':
          $ref: '#/components/responses/Ditolak'
        '409':
          $ref: '#/components/responses/Konflik'
        '422':
          $ref: '#/components/responses/Validasi'
        '429':
          $ref: '#/components/responses/BatasLaju'
        '500':
          $ref: '#/components/responses/GalatServer'

  /lot/{id}/sortir:
    post:
      tags: [Gudang]
      operationId: sortirLot
      summary: Catat hasil sortir A/B/C
      description: |
        Berat dalam gram integer. Server menolak (`422`) bila total A+B+C menyimpang dari berat
        kotor lebih dari 2 persen (selisih x 100 <= kotor x 2, tanpa pembulatan; contoh L-8812: 100.000 +
        14.000 + 6.000 = 120.000). Grade C tidak masuk rantai dingin dan dicatat alihnya. Gudang menang untuk
        berat dan grade saat konflik. `{id}` boleh kode `L-NNNN` atau `TMP-*` dan wajib sama dengan `lot_id`
        pada badan (`422`). Lot yang sudah disortir dengan `uuid` berbeda `409`.
      security:
        - bearerAuth: []
          deviceKey: []
      parameters:
        - $ref: '#/components/parameters/LotId'
        - $ref: '#/components/parameters/PerangkatId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SortirRequest'
            example:
              uuid: 3c9d2e1f-7a4b-4c58-9d06-1e2f3a4b5c6d
              lot_id: L-8812
              grade_a_g: 100000
              grade_b_g: 14000
              grade_c_g: 6000
              petugas: OPR-SORTIR-1
      responses:
        '400':
          $ref: '#/components/responses/InputTakTerbaca'
        '200':
          $ref: '#/components/responses/AksiDuplikat'
        '201':
          description: Sortir tercatat.
