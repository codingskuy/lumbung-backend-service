  /sinkron/batch:
    post:
      tags: [Gudang]
      operationId: sinkronBatch
      summary: Catch-up setelah offline (maks 200 rekaman, FIFO)
      description: |
        Rekaman diproses berurutan FIFO. Nomor sementara `TMP-*` dipetakan ke nomor resmi pada respons.
        Batch 25 keranjang (<100 KB) tersinkron <30 detik pada 1 Mbps. Offline lebih dari 3x24 jam
        mengunci penerbitan surat jalan baru (timbang dan bukti tetap diizinkan): rekaman `surat_jalan` dengan
        `dibuat_pada` lebih dari 72 jam lalu berstatus `DITOLAK`. Setiap rekaman dalam transaksi bagian sendiri
        (savepoint): satu rekaman gagal tidak membatalkan yang lain; galat basis data membatalkan seluruh request
        (kirim ulang aman, semua idempoten). Status per rekaman: `DITERIMA`, `DUPLIKAT` (UUID sudah diproses),
        `KONFLIK` (gudang menang untuk berat dan grade; dicatat sebagai insiden `konflik_sinkron`), `DITOLAK`
        (validasi gagal; `pesan` berisi alasan). Bukti terima yang bentrok: lapangan menang (bukti terbaru berlaku,
        konflik dicatat). Lebih dari 200 rekaman atau kosong `422`.
      security:
        - bearerAuth: []
          deviceKey: []
      parameters:
        - $ref: '#/components/parameters/PerangkatId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SinkronBatchRequest'
