[package]
name = "lumbung-backend-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web + async runtime
axum = { version = "0.8.4", features = ["multipart"] }
tokio = { version = "1.47.1", features = ["full"] }
tower-http = { version = "0.6.2", features = ["trace", "cors", "timeout"] }

# Database lumbung (Postgres khusus lumbung)
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "migrate", "chrono", "json"] }

# Observability + error
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
thiserror = "2.0.12"
anyhow = "1.0.99"

# Serde + validasi + id
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
validator = { version = "0.20.0", features = ["derive"] }
uuid = { version = "1.18.0", features = ["v7", "serde"] }
chrono = { version = "0.4.41", features = ["serde"] }

# Auth: JWT + hashing kata sandi
jsonwebtoken = "9.3.1"
argon2 = "0.5.3"

[dev-dependencies]
tokio = { version = "1.47.1", features = ["full", "test-util"] }
# Uji: panggil router tanpa soket (oneshot) dan bangkitkan pasangan kunci ed25519 sementara.
tower = { version = "0.5.3", features = ["util"] }
ring = "0.17.14"

# Hash PIN argon2 sangat lambat tanpa optimasi pada build debug (uji #[sqlx::test]).
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
